name: Pull request build

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    name: Build PaperTodo
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[ci]') ||
      contains(github.event.head_commit.message, '[debug-ci]')
    concurrency:
      group: pull-request-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\PaperTodo.csproj

      - name: Build
        id: build
        run: |
          $output = @(& dotnet build .\PaperTodo.csproj -c Release --no-restore 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          $firstError = $output |
            ForEach-Object { "$_" } |
            Where-Object { $_ -match ': error ' -or $_ -match ' error [A-Z]+[0-9]+:' } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($firstError)) {
            $firstError = if ($exitCode -eq 0) { "Build succeeded" } else { "dotnet build failed with exit code $exitCode" }
          }
          $firstError = ($firstError -replace '[\r\n]+', ' ').Trim()
          "first_error=$firstError" >> $env:GITHUB_OUTPUT
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Expose diagnostic run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ERROR: ${{ steps.build.outputs.first_error }}
        run: |
          $state = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $description = if ([string]::IsNullOrWhiteSpace($env:BUILD_ERROR)) {
            "Build failed before compiler diagnostics"
          } else {
            $env:BUILD_ERROR
          }
          if ($description.Length -gt 140) {
            $description = $description.Substring(0, 140)
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = $state
            context = "diagnostic/pull-request-build"
            target_url = $runUrl
            description = $description
          } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -Headers $headers `
            -Body $body `
            -ContentType "application/json" | Out-Null
