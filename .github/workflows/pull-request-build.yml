name: Pull request build

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    name: Build PaperTodo
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[ci]') ||
      contains(github.event.head_commit.message, '[debug-ci]')
    concurrency:
      group: pull-request-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\PaperTodo.csproj

      - name: Build
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Expose diagnostic run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $state = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            state = $state
            context = "diagnostic/pull-request-build"
            target_url = $runUrl
            description = "Build run ${{ github.run_id }}"
          } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -Headers $headers `
            -Body $body `
            -ContentType "application/json" | Out-Null
