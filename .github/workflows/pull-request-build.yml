name: Pull request build

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/debug.yml"
      - ".github/workflows/plugin-samples.yml"
      - "plugin-samples/**"
      - "plugins/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PaperTodo
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[ci]') ||
      contains(github.event.head_commit.message, '[debug-ci]')
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\PaperTodo.csproj

      - name: Build
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Run edge refinement checks
        run: dotnet run --project .\scripts\edge-refinement-tests\EdgeRefinementChecks.csproj -c Release
