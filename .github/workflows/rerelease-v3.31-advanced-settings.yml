name: Re-release v3.31 advanced settings

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rerelease-v3.31-advanced-settings.yml"

permissions:
  contents: write
  actions: write

jobs:
  update-and-dispatch:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out 3.x
        uses: actions/checkout@v4
        with:
          ref: 3.x
          fetch-depth: 0

      - name: Move advanced settings note into v3.31
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"
          $text = Get-Content -LiteralPath $path -Raw

          $unreleasedNote = '- **高级设置视觉区分**：开启高级设置后，高级选项会以轻微染色背景与边框分组显示，更容易与常用设置区分。'
          if ($text.Contains($unreleasedNote)) {
            $text = $text.Replace($unreleasedNote, '- 暂无')
          }

          $releaseNote = '- **高级设置视觉区分**：开启高级设置后，高级选项会以轻微染色背景与边框分组显示，更容易与常用设置区分。'
          if (-not $text.Contains("### v3.31`r`n`r`n**设置与视觉**")) {
            $old = "### v3.31`r`n`r`n**bug修复**"
            if (-not $text.Contains($old)) {
              $old = "### v3.31`n`n**bug修复**"
            }
            if (-not $text.Contains($old)) {
              throw "Could not locate v3.31 bug-fix section."
            }
            $new = "### v3.31`r`n`r`n**设置与视觉**`r`n`r`n$releaseNote`r`n`r`n**bug修复**"
            $text = $text.Replace($old, $new)
          }

          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit v3.31 changelog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "release: include advanced settings tint in v3.31"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:3.x
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Dispatch stable v3.31 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml `
            --repo snownico0722/PaperTodo `
            --ref 3.x `
            -f release_tag=v3.31 `
            -f prerelease=false `
            -f stable_release_confirmed=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
