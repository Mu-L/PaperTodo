name: Publish v3.31 Win7 best-effort

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v3.31-win7.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      SOURCE_COMMIT: "f82509d324b1d9e7a8d54a749718d758de3d167d"
      RELEASE_TAG: "v3.31"
      WIN7_VERSION: "3.31-win7BestEffort"
      WIN7_EXE: "PaperTodo-v3.31-win7BestEffort-win-x64-self-contained.exe"

    steps:
      - name: Check out v3.31 Win7 compatibility snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify source ancestry
        run: |
          git merge-base --is-ancestor 8de746d03052e1cda14c44b3debf32548476a489 $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) {
            throw "Win7 compatibility snapshot is not based on the v3.31 release commit."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build Win7 best-effort single file
        run: .\build-win7.ps1 -SelfContained

      - name: Verify output
        run: |
          $output = ".\输出\PaperTodo-v$env:WIN7_VERSION"
          $exe = Join-Path $output $env:WIN7_EXE
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Win7 best-effort build did not produce $env:WIN7_EXE."
          }

          $files = @(Get-ChildItem -LiteralPath $output -File -Recurse)
          if ($files.Count -ne 1) {
            $files | Select-Object FullName, Length | Format-Table
            throw "Win7 best-effort output is not a true single-file package."
          }

          Get-Item -LiteralPath $exe | Format-Table Name, Length

      - name: Add executable to v3.31 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = ".\输出\PaperTodo-v$env:WIN7_VERSION\$env:WIN7_EXE"
          gh release upload $env:RELEASE_TAG $exe --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add Win7 download line to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = gh release view $env:RELEASE_TAG --json body --jq '.body'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($body -notlike "*$env:WIN7_EXE*") {
            $line = "- Windows 7 SP1 x64 Best Effort（含 .NET 运行库）：$env:WIN7_EXE"
            $newBody = $body.TrimEnd() + "`n" + $line + "`n"
            $releaseId = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" --jq '.id'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -f body="$newBody" | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
