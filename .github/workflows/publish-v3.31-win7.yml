name: Repair v3.31 release notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v3.31-win7.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out current 3.x
        uses: actions/checkout@v7
        with:
          ref: 6d998958aad6c86f67a4419edb7bd8ae59d3789e
          fetch-depth: 1

      - name: Restore v3.31 release notes formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v3.31'
          $lines = Get-Content -LiteralPath .\CHANGELOG.md
          $headingPattern = '^\s*###\s+' + [regex]::Escape($tag) + '(\s|$)'
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $headingPattern) {
              $start = $i
              break
            }
          }
          if ($start -lt 0) { throw "CHANGELOG.md does not contain $tag" }

          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\s*###\s+v') {
              $end = $i
              break
            }
          }

          $changelogNotes = (($lines[($start + 1)..($end - 1)] -join "`n").Trim())
          $notes = @(
            $changelogNotes,
            '',
            '下载:',
            '',
            '- 完整版（含 .NET 运行库）：PaperTodo-v3.31-win-x64-self-contained.exe',
            '- 精简版（需自行安装 .NET 运行库）：PaperTodo-v3.31-win-x64-no-runtime.exe',
            '- Windows 7 SP1 x64 Best Effort（含 .NET 运行库）：PaperTodo-v3.31-win7BestEffort-win-x64-self-contained.exe'
          ) -join "`n"

          $notesPath = Join-Path $env:RUNNER_TEMP 'v3.31-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release edit $tag --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
