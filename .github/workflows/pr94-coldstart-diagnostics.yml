name: PR94 cold-start diagnostics

on:
  push:
    branches:
      - agent/v3-lite-edge-presentation
    paths:
      - scripts/pr94-coldstart-diagnostics/TRIGGER

permissions:
  contents: write

jobs:
  instrument:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Check out PR94
        uses: actions/checkout@v7
        with:
          ref: agent/v3-lite-edge-presentation
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Apply cold-start instrumentation
        run: git apply --whitespace=nowarn scripts/pr94-coldstart-diagnostics/instrument.patch

      - name: Verify diagnostic shape
        run: |
          git diff --check
          if (-not (Select-String -Path EdgeCapsuleQueueCompositionProxy.Startup.cs -Pattern 'publication-verified' -Quiet)) { throw 'startup boundary diagnostics missing' }
          if (-not (Select-String -Path WindowNative.cs -Pattern 'after-cloak-attributes' -Quiet)) { throw 'cloak boundary diagnostics missing' }
          if (-not (Select-String -Path EdgeCapsuleColdStartDiagnostics.cs -Pattern 'PAPERTODO_EDGE_COLD_STALL_STAGE' -Quiet)) { throw 'fault injection control missing' }

      - name: Restore
        run: |
          dotnet restore .\PaperTodo.csproj
          dotnet restore .\scripts\edge-refinement-tests\EdgeRefinementChecks.csproj

      - name: Debug build
        run: dotnet build .\PaperTodo.csproj -c Debug --no-restore

      - name: Release build
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Edge refinement checks
        run: dotnet run --project .\scripts\edge-refinement-tests\EdgeRefinementChecks.csproj -c Release --no-restore

      - name: Remove temporary instrumentation publisher
        run: |
          git rm -r --ignore-unmatch .github/workflows/pr94-coldstart-diagnostics.yml scripts/pr94-coldstart-diagnostics

      - name: Commit validated diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EdgeCapsuleColdStartDiagnostics.cs EdgeCapsuleQueueCompositionProxy.Startup.cs WindowNative.cs
          git add -u
          git diff --cached --check
          git commit -m "chore(edge): instrument cold-start authority boundary"
          git push origin HEAD:agent/v3-lite-edge-presentation
