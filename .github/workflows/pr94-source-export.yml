name: PR94 source export

on:
  push:
    branches:
      - agent/v3-lite-edge-presentation
    paths:
      - scripts/pr94-source-export/READY

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out PR94 source
        uses: actions/checkout@v7
        with:
          ref: agent/v3-lite-edge-presentation
          fetch-depth: 0
          submodules: recursive

      - name: Pack complete working tree
        run: |
          tar -a -c -f pr94-source.zip --exclude=.git --exclude=pr94-source.zip .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pr94-source
          path: pr94-source.zip
          if-no-files-found: error
          retention-days: 1

      - name: Report export run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 94 --repo snownico0722/PaperTodo --body "PR94 source export run: $env:GITHUB_RUN_ID"
