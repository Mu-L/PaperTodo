name: Polish obsolete experiment cleanup

on:
  push:
    branches:
      - cleanup/remove-obsolete-collapse-and-virtual-desktop

permissions:
  contents: write

jobs:
  polish:
    if: contains(github.event.head_commit.message, '[repo-polish]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Polish cleanup diff and verify
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          import subprocess

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='')

          def exact(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count}: {old!r}')
              write(path, text.replace(old, new))

          exact(
              'src/AppController.cs',
              '        if (!_isRestoringStartupPapers)\n        {\n        }\n',
              '')
          exact(
              'src/AppController.cs',
              '        if (!paper.IsCollapsed)\n        {\n        }\n',
              '')
          exact(
              'src/PaperWindow.Capsule.cs',
              '\nRefreshExperimentalOpacity();\n',
              '\n        RefreshExperimentalOpacity();\n')
          exact(
              'src/EdgeCapsuleHost.cs',
              '        : new WindowInteropHelper(Window).Handle;\n\n\n    public void AttachNativeHooks',
              '        : new WindowInteropHelper(Window).Handle;\n\n    public void AttachNativeHooks')

          for resource in [
              'Resources/Strings.resx',
              'Resources/Strings.en.resx',
              'Resources/Strings.ja.resx',
              'Resources/Strings.ko.resx',
          ]:
              text = read(resource)
              pattern = re.compile(r'(</data>)\n(?:[ \t]*\n)+<data name="LabsTodoReminders"')
              text2, count = pattern.subn(r'\1\n  <data name="LabsTodoReminders"', text)
              if count != 1:
                  raise SystemExit(f'{resource}: expected 1 reminder-boundary cleanup, got {count}')
              write(resource, text2)

          checks = {
              'src/AppController.cs': [
                  'if (!_isRestoringStartupPapers)\n        {\n        }',
                  'if (!paper.IsCollapsed)\n        {\n        }',
              ],
              'src/PaperWindow.Capsule.cs': ['\nRefreshExperimentalOpacity();\n'],
              'src/EdgeCapsuleHost.cs': ['Handle;\n\n\n    public void AttachNativeHooks'],
          }
          for path, needles in checks.items():
              text = read(path)
              for needle in needles:
                  if needle in text:
                      raise SystemExit(f'{path}: cleanup artifact still present: {needle!r}')

          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['dotnet', 'restore', '.\\PaperTodo.csproj'], check=True)
          subprocess.run(['dotnet', 'build', '.\\PaperTodo.csproj', '-c', 'Release', '--no-restore'], check=True)

          Path('.github/workflows/polish-obsolete-cleanup.yml').unlink()
          Path('.cleanup_polish.py').unlink(missing_ok=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', '[ci] cleanup: polish obsolete experiment purge'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD'], check=True)
          '@ | Set-Content -Encoding UTF8 .cleanup_polish.py
          python .cleanup_polish.py
