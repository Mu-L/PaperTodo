name: One-shot obsolete experiment cleanup

on:
  push:
    branches:
      - cleanup/remove-obsolete-collapse-and-virtual-desktop

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[repo-cleanup]')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Purge obsolete experiment code and verify
        run: python .\tools\cleanup_obsolete_experiments.py
