name: PR137 final cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr137-final-clean.yml"

permissions:
  contents: write

jobs:
  clean:
    if: github.event.pull_request.head.ref == 'audit-4-0-slim-20260823'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: audit-4-0-slim-20260823
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Apply final cleanup
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          event_hub = "src/PaperBodyPluginEventHub.cs"
          replace_once(
              event_hub,
              '''    public void FlushUserChanges()
              {
                  _dispatcher.VerifyAccess();
                  if (_disposed || _subscriptions.Count == 0 || _suppressionDepth > 0)
                  {
                      return;
                  }

                  var stamp = CaptureChangeStamp();
                  if (stamp == _observedStamp)
                  {
                      return;
                  }

                  _flushTimer.Stop();
                  ScanNowCore(PaperOperationContext.User(), stamp);
              }

          ''',
              '')

          replace_once(
              event_hub,
              '''    public void NotifyMutationStampChanged()
              {
                  if (_dispatcher.CheckAccess())
                  {
            QueueUserChangesIfNeeded();
            return;
                  }

                  _ = _dispatcher.BeginInvoke(
            (Action)QueueUserChangesIfNeeded,
            DispatcherPriority.ContextIdle);
              }
          ''',
              '''    public void NotifyMutationStampChanged()
              {
                  if (_dispatcher.CheckAccess())
                  {
                      QueueUserChangesIfNeeded();
                      return;
                  }

                  _ = _dispatcher.BeginInvoke(
                      (Action)QueueUserChangesIfNeeded,
                      DispatcherPriority.ContextIdle);
              }
          ''')

          decisions = "DECISIONS.md"
          replace_once(
              decisions,
              "插件可以提供 Native 专属 mini、Web `miniEntry`、允许迁移的纯 WPF 正文 View、自定义/标准 capsule 或 plain text，但 Edge preview 的窗口、queue placement、外层尺寸会话和输入 authority 始终属于宿主。",
              "插件可以提供 Native 专属 mini、Web `miniEntry`、自定义/标准 capsule 或 plain text，但 Edge preview 的窗口、queue placement、外层尺寸会话和输入 authority 始终属于宿主。")
          replace_once(
              decisions,
              "- 没有专属 1.8 preview 能力时：才进入 custom/standard capsule/plain-text fallback。",
              "- 没有专属 preview 能力时：进入 custom/standard capsule/plain-text fallback。")
          replace_once(
              decisions,
              "- 不为正文迁移维护持续截图循环或第二份 authoritative plugin state。\n",
              "")
          replace_once(
              decisions,
              "- `src/PaperWindow.PluginBodyMigration.cs`。",
              "- PR #137 — 退役 Native body migration，删除 reparent/snapshot/warmup/retry 路线。")

          text = Path(decisions).read_text(encoding="utf-8").rstrip() + "\n"
          Path(decisions).write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Diff sanity
        run: git diff --check

      - name: Restore
        run: dotnet restore .\PaperTodo.csproj

      - name: Build
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(plugin): finish PR137 slim-down cleanup"
          git push origin HEAD:audit-4-0-slim-20260823
