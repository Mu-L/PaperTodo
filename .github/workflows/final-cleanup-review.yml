name: Final obsolete experiment cleanup review

on:
  push:
    branches:
      - cleanup/remove-obsolete-collapse-and-virtual-desktop

permissions:
  contents: write

jobs:
  review-fix:
    if: contains(github.event.head_commit.message, '[final-cleanup]')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Fix review-only cleanup remnants
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='')

          app_path = Path('src/AppController.cs')
          app = read(app_path)
          for block in [
              '        if (!_isRestoringStartupPapers)\n        {\n        }\n',
              '        if (!paper.IsCollapsed)\n        {\n        }\n',
          ]:
              count = app.count(block)
              if count != 1:
                  raise SystemExit(f'AppController.cs expected one empty cleanup block, found {count}: {block!r}')
              app = app.replace(block, '')
          write(app_path, app)

          capsule_path = Path('src/PaperWindow.Capsule.cs')
          capsule = read(capsule_path)
          bad = '\nRefreshExperimentalOpacity();\n'
          if capsule.count(bad) != 1:
              raise SystemExit(f'PaperWindow.Capsule.cs expected one unindented call, found {capsule.count(bad)}')
          capsule = capsule.replace(bad, '\n        RefreshExperimentalOpacity();\n')
          write(capsule_path, capsule)

          for resource in [
              'Resources/Strings.resx',
              'Resources/Strings.en.resx',
              'Resources/Strings.ja.resx',
              'Resources/Strings.ko.resx',
          ]:
              text = read(resource)
              pattern = re.compile(r'(  </data>)\n(?:[ \t]*\n)+<data name="LabsTodoReminders"')
              text2, count = pattern.subn(r'\1\n  <data name="LabsTodoReminders"', text)
              if count != 1:
                  raise SystemExit(f'{resource}: expected one virtual-desktop deletion seam, found {count}')
              write(resource, text2)

          workflow = Path('.github/workflows/final-cleanup-review.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Verify diff integrity
        run: git diff --check

      - name: Verify Release build
        run: |
          dotnet restore .\PaperTodo.csproj
          dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Commit reviewed cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[ci] cleanup: finish obsolete experiment scrub"
          git push origin HEAD:cleanup/remove-obsolete-collapse-and-virtual-desktop
