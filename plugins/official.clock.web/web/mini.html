<html lang="zh-CN">

  <title>PaperTodo Clock Mini</title>

  </style>
</head>
<body><main><div id="zone" class="zone"></div><div id="time"><span id="hours"></span>:<span id="minutes"></span><span id="seconds"></span></div><div id="date"></div><div id="track" class="track"><div id="progress"></div></div></main>
